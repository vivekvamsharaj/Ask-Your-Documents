<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document QA System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Documents</h2>
            <div class="upload-zone" id="dropZone">
                <p>Drag & drop PDFs/Text files here or</p>
                <button type="button" id="browseBtn">Browse Files</button>
                <input type="file" id="fileInput" multiple accept=".pdf,.txt" hidden>
            </div>
            <div class="file-list" id="fileList">
                </div>
        </aside>

        <main class="chat-container">
            <header class="chat-header">
                <h1>Chat with Your Documents</h1>
            </header>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message system-message">
                    Hello! Upload a document on the left, and I'll answer questions based on its content.
                </div>
            </div>

            <form class="chat-input-area" id="chatForm">
                <input type="text" id="userInput" placeholder="Ask something about your documents..." required autocomplete="off">
                <button type="submit" id="sendBtn">Send</button>
            </form>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
